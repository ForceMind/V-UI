in button{width:100%}.index-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.index-grid a{display:block;padding:10px;border:1px solid #bbb;text-decoration:none;min-height:44px}.drawer-shade{display:none}.empty-mark{width:48px;height:35px;border:1px dashed #777;margin:0 auto 18px}.footer-note{padding:10px 0 25px;font-size:11px;color:#777}.mobile-only{display:none}details{border:1px solid #bbb;padding:12px 15px;margin:16px 0}summary{cursor:pointer;min-height:28px}ul{padding-left:21px}.inline-input{width:100%;min-height:44px;padding:9px;border:1px solid #aaa}.protocol-note{margin-top:8px;font-size:12px;border-top:1px dashed #bbb;padding-top:12px}.logs{min-height:220px}.skeleton{height:18px;width:65%;background:#ddd;margin:15px auto}.skeleton.short{width:35%}[hidden]{display:none!important}

<body>
<div class="review-tools" aria-label="线稿审阅工具">
<strong>V-UI / 全站低保真线稿 <small>· 设计审阅，全部为示例</small></strong>
<button data-action="index">屏幕索引</button><button id="phone-toggle" data-action="phone" aria-pressed="false">手机宽度预览</button>
<label>演示状态 <select id="scenario" aria-label="演示页面状态"><option value="normal">正常示例</option><option value="loading">加载中</option><option value="empty">空数据</option><option value="error">加载失败</option><option value="processing">操作处理中</option><option value="conflict">修订冲突</option><option value="expired">会话过期</option></select></label>
<button data-go="/login">登录页</button>
</div>
<div id="preview" class="preview"></div><div id="modal-root"></div><div id="toast" class="toast" role="status" hidden></div>
<script>
'use strict';
// Offline design demonstration: no requests, storage, credentials, APIs, or product mutations.
const pages=[['overview','总览'],['nodes','节点管理'],['routing','分流配置'],['subscriptions','订阅授权'],['proxy','代理与中转'],['certificates','证书管理'],['services','核心与服务'],['logs','日志与诊断'],['firewall','防火墙'],['security','安全中心'],['account','账户设置'],['legacy','站点托管 · 历史']];
const allowedPages=new Set(pages.map(p=>p[0]).concat('login'));
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(label,action,cls='')=>`<button class="${cls}" data-action="${action}">${label}</button>`;
const go=(label,path,cls='')=>`<a class="button ${cls}" href="#${path}" data-go="${path}">${label}</a>`;
const field=(name,label,value='',hint='',type='text')=>`<label class="field"><span>${label}</span><input name="${name}" type="${type}" value="${esc(value)}" ${type==='password'?'autocomplete="off"':''}><small>${hint}</small></label>`;
const select=(name,label,items,value,hint='')=>`<label class="field"><span>${label}</span><select name="${name}">${items.map(x=>`<option ${x===value?'selected':''}>${esc(x)}</option>`).join('')}</select><small>${hint}</small></label>`;
const area=(name,label,value,hint='')=>`<label class="field"><span>${label}</span><textarea name="${name}">${esc(value)}</textarea><small>${hint}</small></label>`;
const check=(name,label,checked=false)=>`<label class="check"><input name="${name}" type="checkbox" ${checked?'checked':''}>${label}</label>`;
const note=t=>`<div class="notice">${t}</div>`;
const panel=(title,body,action='')=>`<section class="panel"><div class="panel-head"><h2>${title}</h2>${action}</div>${body}</section>`;
const table=(heads,rows)=>`<div class="table-wrap"><table><thead><tr>${heads.map(h=>`<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const stat=(name,value,sub)=>`<div class="metric"><span>${name}</span><strong>${value}</strong><small>${sub}</small></div>`;
let scenario='normal', current='',dirty=false,pending='',drawer=false,phone=false,lastFocus=null,modalFromClick=false,returnTo='/overview';
const drafts={node:{core:'sing-box',protocol:'VLESS',remark:'',port:'443',security:'TLS',transport:'TCP',routing:'跟随全局',state:'启用'},proxy:{host:false,relay:false},routing:{},certificate:{},account:{},grant:{},import:{}};
const initialDrafts=JSON.parse(JSON.stringify(drafts));
function resetDraft(key){if(key&&initialDrafts[key])drafts[key]=JSON.parse(JSON.stringify(initialDrafts[key]));}
const nodeFilter={search:'',protocol:'全部协议',page:1};
const scrollPositions=new Map();
let draftImport=false,proxyChecked=false;
const modals=new Set(['index','share','export','delete-node','apply-node','dirty','grant','issued','revoke','rotate','import','import-preview','apply-proxy','yaml','certificate-apply','bind','renew','restart','account-save','logout','diagnostic','readiness','unavailable']);
function parse(hash=location.hash){let text=hash.replace(/^#/,'')||'/overview';let [path,q='']=text.split('?');const parts=path.split('/').filter(Boolean);if(!allowedPages.has(parts[0]))return{path:'/overview',page:'overview',parts:['overview'],query:new URLSearchParams(),invalid:true};if(parts[0]==='nodes'&&(parts.length>2||(parts[1]&&!['new','edit','detail'].includes(parts[1]))))path='/nodes';else if(parts[0]==='certificates'&&(parts.length>2||(parts[1]&&!['new','detail'].includes(parts[1]))))path='/certificates';else if(!['nodes','certificates'].includes(parts[0])&&parts.length>1)path='/'+parts[0];const query=new URLSearchParams(q);if(query.has('modal')&&!modals.has(query.get('modal')))query.delete('modal');return{path,page:parts[0],parts:path.split('/').filter(Boolean),query};}
function hashFor(path,query){return path+(query.toString()?'?'+query:'');}
function route(){return parse();}
function internalTarget(){const r=route();r.query.delete('modal');return hashFor(r.path,r.query);}
function title(r=route()){if(r.page==='nodes'&&r.parts[1])return({'new':'新建节点','edit':'编辑节点','detail':'节点详情'})[r.parts[1]];if(r.page==='certificates'&&r.parts[1])return r.parts[1]==='new'?'申请证书':'证书详情';return pages.find(p=>p[0]===r.page)?.[1]||'管理员登录';}
function formKey(r=route()){if(r.page==='nodes'&&['new','edit'].includes(r.parts[1]))return'node';if(r.page==='proxy')return'proxy';if(r.page==='routing')return'routing';if(r.page==='account')return'account';if(r.page==='certificates'&&r.parts[1]==='new')return'certificate';return'';}
function sameForm(a,b){const pa=parse('#'+a),pb=parse('#'+b);return pa.path===pb.path&&!!formKey(pa);}
function navigate(path){const next=parse('#'+path);path=hashFor(next.path,next.query);if(dirty&&!sameForm(current,path)){pending=path;showModal('dirty',false);return;}location.hash=path;}
function showModal(name,routeBased=true){lastFocus=document.activeElement;if(routeBased){const r=route();const already=r.query.has('modal');r.query.set('modal',name);if(already){history.replaceState(null,'','#'+hashFor(r.path,r.query));current=hashFor(r.path,r.query);renderModal(name);restoreDrafts();}else{modalFromClick=true;location.hash=hashFor(r.path,r.query);}}else renderModal(name);}
function closeModal(){drafts.import={};drafts.grant={};if(route().query.has('modal')){const r=route();r.query.delete('modal');if(modalFromClick){modalFromClick=false;history.back();}else{history.replaceState(null,'','#'+hashFor(r.path,r.query));render();}}else{$('#modal-root').innerHTML='';}lastFocus?.focus?.();}
function toast(text){const t=$('#toast');t.textContent=text;t.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.hidden=true,4000);}
function tabbar(items,active,base){return`<nav class="tabs" aria-label="内容分区">${items.map(([id,label])=>`<a href="#${base}?tab=${id}" data-go="${base}?tab=${id}" ${active===id?'class="active" aria-current="page"':''}>${label}</a>`).join('')}</nav>`;}
function breadcrumb(r){let out=go('总览','/overview');if(r.page!=='overview')out+=` <span> / </span> ${r.parts.length>1?go(pages.find(p=>p[0]===r.page)?.[1]||'', '/'+r.page):esc(title(r))}`;if(r.parts.length>1)out+=` <span> / </span> ${esc(title(r))}`;return out;}
function shell(r,body){return`<div class="app-shell"><div class="drawer-shade" data-action="drawer"></div><aside class="sidebar" aria-label="主导航"><div class="brand">V-UI<small>管理控制台 · 统一导航线稿</small></div><nav>${pages.map(([id,label],i)=>`${[0,6,9,11].includes(i)?`<div class="nav-group">${({0:'业务配置',6:'运行维护',9:'管理',11:'高级 / 历史保留'})[i]}</div>`:''}<a href="#/${id}" data-go="/${id}" class="nav-link ${r.page===id?'active':''}" ${r.page===id?'aria-current="page"':''}><span class="num">${String(i+1).padStart(2,'0')}</span>${label}</a>`).join('')}</nav><div class="foot">线稿 v1 · 所有数据均为示例<br>离线 HTML / 不连接服务</div></aside><div class="workspace"><header class="topbar">${btn('☰','drawer','menu-toggle')}<div class="crumb" aria-label="面包屑">${breadcrumb(r)}</div><span class="account-name">示例管理员</span>${go('账户','/account')}</header><main class="main"><div class="demo-strip"><strong>线稿演示</strong> · 所有数据、状态和操作结果均为示例；不会保存到真实服务器。${dirty?' <b>当前有未保存草稿</b>':''}</div>${body}<div class="footer-note">V-UI 全站线稿 / 灰阶结构审阅 / 本页面不代表功能已实现或已上线</div></main></div></div>`;}
function heading(r,description,action=''){return`<div class="page-head"><div class="intro"><h1>${title(r)}</h1><p>${description}</p></div><div class="actions">${action}</div></div>`;}
function pageState(r){if(scenario==='normal'||r.page==='login')return'';const states={loading:['正在读取页面','先呈现页面标题与骨架；未知状态不显示为 0 或正常。','<div class="skeleton"></div><div class="skeleton short"></div>'],empty:['还没有相关数据','保留当前筛选；当筛选无结果时提供清除筛选。创建入口在页面右上角。',btn('清除筛选 / 恢复正常示例','reset-state')],error:['读取失败，当前状态未知','保留草稿与筛选。重试不重启核心，不假定旧状态仍有效。',btn('重试读取（演示）','reset-state')],processing:['操作正在处理中','阻止重复提交；这里只展示等待状态，没有发出真实请求。',btn('完成本次演示','reset-state')],conflict:['配置已被其他管理员更新','你的草稿仍保留在当前页面。重新载入前核对差异；不自动覆盖新修订。',btn('核对修订差异','readiness')],expired:['会话已过期','重新登录后恢复允许的站内目标；敏感草稿不会写入 URL 或本地存储。',go('重新登录','/login')]};const [h,p,a]=states[scenario]||states.error;return`<div class="state-card" role="status"><div class="empty-mark"></div><h2>${h}</h2><p>${p}</p>${a}</div>`;}
function overview(){return`<div class="metrics">${stat('CPU','12%','示例 · 4 核')}${stat('内存','768 MB','示例 · 共 2 GB')}${stat('节点','6','示例 · 5 个启用 / 1 个停用')}${stat('待处理','2','示例 · 证书应用 / 配置修订')}</div><div class="grid">${panel('核心与服务',table(['对象','当前状态','下一步'],[['Xray','运行中 · 示例',go('查看','/services')],['sing-box','运行中 · 示例',go('查看','/services')],['面板服务','状态未确认 · 示例',go('诊断','/logs')]]))}${panel('需要处理',`<p><span class="badge">证书</span> 新证书已签发，1 个绑定待应用。</p>${go('查看证书使用位置','/certificates/detail')}<div class="rule"></div><p><span class="badge">代理草稿</span> 已保存修订与活动配置不一致。</p>${go('核对并应用','/proxy')}`)}</div>${panel('快捷入口',`<div class="actions">${go('新建节点','/nodes/new','primary')}${go('创建订阅','/subscriptions')}${go('配置分流','/routing')}${go('日志与诊断','/logs')}</div><p class="hint">总览只汇总状态；重启、应用等操作进入具体页面核对。</p>`)}`;}
const exampleNodes=[['东京 · TCP','VLESS','443','跟随全局','中转 · 已应用'],['备用 · 直连','VLESS','8443','指定直连','直连 · 已应用'],['移动 · WS','Trojan','9443','跟随全局','直连 · 已应用'],['家用 · TCP','VMess','10443','跟随全局','直连 · 已应用'],['QUIC · 测试','Hysteria2','2443 / UDP','指定直连','直连 · 已应用'],['QUIC · 备用','TUIC','3443 / UDP','指定直连','停用']];
function nodes(r){if(['new','edit'].includes(r.parts[1]))return nodeEditor(r);if(r.parts[1]==='detail')return nodeDetail();const rows=exampleNodes.filter(n=>(!nodeFilter.search||n.join(' ').toLowerCase().includes(nodeFilter.search.toLowerCase()))&&(nodeFilter.protocol==='全部协议'||n[1]===nodeFilter.protocol));return`<div class="toolbar"><input id="node-search" type="search" placeholder="搜索备注、协议或端口" aria-label="搜索节点" value="${esc(nodeFilter.search)}"><select id="node-protocol" aria-label="按协议筛选">${['全部协议','VLESS','Trojan','VMess','Hysteria2','TUIC','Shadowsocks'].map(p=>`<option ${p===nodeFilter.protocol?'selected':''}>${p}</option>`).join('')}</select>${btn('筛选','filter-nodes')}${btn('清除','clear-filter')}</div>${rows.length?table(['节点 / 核心','协议 / 端口','已保存路由','实际出口 / 状态','操作'],rows.map((n,i)=>[`<strong>${n[0]}</strong><br><small>${i===3?'Xray':'sing-box'} · 示例节点 ${i+1}</small>`,`${n[1]}<br>${n[2]}`,n[3],n[4],`<div class="actions">${go('详情','/nodes/detail')}${go('编辑','/nodes/edit')}${btn('分享','share')}${btn('更多','export')}</div>`])):`<div class="state-card"><h2>没有匹配节点</h2><p>筛选仍保留，请调整关键词或协议。</p>${btn('清除筛选','clear-filter')}</div>`}<div class="pager"><span>示例共 ${rows.length} 条 · 第 ${nodeFilter.page} / 1 页</span><div class="actions"><button disabled>上一页</button><button disabled>下一页</button></div></div>${note('“已保存路由”与“实际出口”分列。中转不符合资格或未应用时，必须明确显示原因，不用“启用”代替运行结果。')}`;}
function nodeEditor(r){const d=drafts.node,t=r.query.get('tab')||'basic',edit=r.parts[1]==='edit';let body='';if(t==='basic')body=`<div class="form-grid">${field('remark','节点备注',d.remark|| (edit?'东京 · TCP':''),'用于列表和客户端显示')}${field('port','监听端口',d.port,'1–65535；QUIC 需要 UDP 端口，TCP 放行不替代 UDP')}${select('core','核心',['sing-box','Xray'],d.core)}${select('protocol','协议',d.core==='Xray'?['VLESS','Trojan','VMess','Shadowsocks']:['VLESS','Trojan','VMess','Shadowsocks','Hysteria2','TUIC'],d.protocol)}${select('state','节点状态',['启用','停用'],d.state)}</div>${['VLESS','VMess'].includes(d.protocol)?field('uuid','UUID（敏感）','','编辑时留空保留；新建按既有规则生成','password'):''}${['Trojan','Shadowsocks','Hysteria2','TUIC'].includes(d.protocol)?field('password',d.protocol+' 密码','','新建留空按现有规则生成；编辑留空保留，不回显旧密码','password'):''}${d.protocol==='TUIC'?field('tuic_uuid','TUIC UUID','','独立于密码；空输入按新建生成 / 编辑保留处理','password'):''}${d.protocol==='Shadowsocks'?select('method','加密方法',['AES-128-GCM','AES-256-GCM','ChaCha20-IETF-Poly1305'],'AES-128-GCM'):''}`;
if(t==='security')body=d.protocol==='Shadowsocks'?note('Shadowsocks 使用协议自身加密，此处不套用 TLS / REALITY 表单。'): `${!['Hysteria2','TUIC'].includes(d.protocol)?select('security','传输安全',d.protocol==='VLESS'?['None','TLS','REALITY']:['None','TLS'],d.security):note('此 QUIC 节点使用 TLS。保留严格证书验证，不提供跳过校验快捷开关。')}${d.security==='REALITY'&&d.protocol==='VLESS'?`<div class="form-grid">${field('target','握手参考端','reference.example.test:443','示例占位；非真实参考站点')}${field('sni','Server Name / SNI','reference.example.test','显式字面 SNI')}${field('shortid','Short ID（敏感）','','单个规范 16 位 hex；编辑留空保留','password')}${field('privatekey','X25519 私钥（敏感）','','服务端专用；不出现在普通响应与分享配置','password')}</div>${field('publickey','配对公钥','','按已有校验验证配对，不在此生成真实密钥')}${select('fingerprint','浏览器指纹',['Chrome'],'Chrome')}${field('flow','Flow','xtls-rprx-vision','本资格范围固定 Vision + sing-box / VLESS / TCP')}`:d.security==='None'&&!['Hysteria2','TUIC'].includes(d.protocol)?note('无 TLS 仅为现有表单选项的线稿呈现；实际保存与公开导出继续执行现有资格校验。'):`${select('certificate','证书来源',['托管证书：vpn.example.test（示例）','手工证书路径'],'托管证书：vpn.example.test（示例）')}<div class="form-grid">${field('sni','SNI','vpn.example.test','必须匹配证书')}${field('alpn','ALPN',d.protocol==='TUIC'?'h3':d.transport==='gRPC'?'h2':'','QUIC / gRPC 按对应既有协议资格固定')}</div><details><summary>手工证书材料路径</summary>${field('cert_path','证书路径','','仅编辑器特权视图；普通列表不返回材料路径')}${field('key_path','私钥路径','','仅路径字符串；不显示私钥内容')}</details>`}`;
if(t==='transport')body=['Hysteria2','TUIC'].includes(d.protocol)?`${note(d.protocol+' 使用原生 QUIC。节点底层 UDP 不等于应用 UDP 通过验收。')}${d.protocol==='Hysteria2'?`<div class="form-grid">${field('up','上传带宽 Mbps','','公开资格要求留空')}${field('down','下载带宽 Mbps','','公开资格要求留空')}</div>${select('obfs','Obfs',['关闭','Salamander（高级未验收）','Gecko（高级未验收）'],'关闭')}${field('obfs_password','Obfs Password','','仅非关闭配置适用；编辑留空保留','password')}`:`${select('congestion','拥塞控制',['CUBIC','BBR（高级未验收）','New Reno（高级未验收）'],'CUBIC')}${select('udp_relay','UDP Relay',['Native','QUIC（高级未验收）'],'Native')}${check('zero_rtt','启用 0-RTT（高级未验收；公开资格要求关闭）')}`} `:d.protocol==='Shadowsocks'?note('当前 Shadowsocks 不增加额外 WS / gRPC 传输。'): `${select('transport','传输方式',['TCP','WebSocket','gRPC','XHTTP / HTTPUpgrade（保留高级草稿）'],d.transport)}${d.transport==='WebSocket'?`<div class="form-grid">${field('path','Path','/example','保留字面值')}${field('host','Host','vpn.example.test')}</div>`:d.transport==='gRPC'?`${field('grpc_service','gRPC Service','example-service','[A-Za-z0-9._-]{1,128}；不 trim 或强转')}${note('ALPN 省略或仅 h2；Chrome 可选；仅 HTTP/TCP 资格。')}`:d.transport.startsWith('XHTTP')?`${field('advanced_path','Path','/example')}${field('advanced_host','Host','vpn.example.test')}${select('mode','XHTTP Mode',['auto','stream-one','stream-up','packet-up'],'stream-one')}${note('沿用已有高级配置的保留 / 拒绝契约。公开导出仍受阻断；本线稿不宣布支持 XHTTP 或 HTTPUpgrade。')}`:note('直连 TCP；REALITY/Vision 资格固定 TCP，不把其他传输组合视为已支持。')}`;
if(t==='route')body=`${select('routing','该节点的出口策略',['跟随全局','指定直连','指定中转'],d.routing)}<dl class="keyval"><dt>跟随全局</dt><dd>使用“代理与中转”的默认入口中转开关。</dd><dt>指定直连</dt><dd>独立直连，不受主机代理与默认入口中转开关改变。</dd><dt>指定中转</dt><dd>共用唯一上游，即使默认入口中转关闭，也继续按指定中转处理。</dd></dl>${note('保存与应用时重新检查资格。有效中转拒绝应用 UDP；未获资格不能静默直出。')}${go('查看代理与中转','/proxy')}`;
if(t==='advanced')body=`${note('已有未知或高级字段必须保留，不能通过普通表单悄悄删除并解锁公开导出。不支持的组合清楚拒绝。')}<dl class="keyval"><dt>公开资格</dt><dd>示例 · 等待服务端校验；本线稿不执行资格检查。</dd><dt>敏感字段</dt><dd>空输入保留旧值；编辑结束清空输入，不写入 URL / 本地存储。</dd><dt>高级配置</dt><dd>当前示例无附加字段；已有数据出现时显示受限摘要与不可表达项。</dd></dl><pre class="code">只读摘要占位（示例）\nprofile: [由服务端受控解析]\ncredentials: [隐藏]\nunknown_fields: [保留或明确拒绝]</pre>`;
return`${note('分组编辑同一份草稿。切换分组保留输入；离开节点编辑需要确认未保存更改。')}${tabbar([['basic','1 基础'],['security','2 安全'],['transport','3 传输'],['route','4 路由'],['advanced','5 高级']],t,r.path)}<section class="panel" data-draft="node"><h2>${({basic:'基础信息',security:'安全与凭据',transport:'传输参数',route:'每入口路由',advanced:'高级与兼容性'})[t]||'基础信息'}</h2>${body}<div class="protocol-note">当前选择：${esc(d.core)} / ${esc(d.protocol)} / ${esc(d.security)} / ${esc(d.transport)}。选项展示用于字段审阅，最终支持组合必须沿用现有服务端校验。</div></section><div class="form-footer"><small>${edit?'编辑示例节点；空白敏感字段保留原值。':'新建示例节点；不会创建真实节点。'} 保存前核对端口、证书和出口。</small><div class="actions">${go('取消 / 返回列表','/nodes')}${btn(edit?'核对并保存应用':'核对并创建应用','apply-node','primary')}</div></div>`;}
function nodeDetail(){return`${panel('东京 · TCP <span class="badge">示例</span>',`<dl class="keyval"><dt>核心 / 协议</dt><dd>sing-box / VLESS / TLS / TCP</dd><dt>监听端口</dt><dd>443 / TCP</dd><dt>节点状态</dt><dd>启用；核心运行中（示例）</dd><dt>已保存策略</dt><dd>跟随全局</dd><dt>实际出口</dt><dd>中转 · 活动修订 12（示例）</dd><dt>托管证书</dt><dd>${go('vpn.example.test','/certificates/detail')}</dd><dt>敏感数据</dt><dd>UUID、密码、私钥与材料路径不在此显示。</dd></dl><div class="actions">${go('编辑节点','/nodes/edit','primary')}${btn('分享 / 二维码','share')}${btn('订阅与导出','export')}${btn('删除节点','delete-node','danger')}</div>`)}${panel('应用与导出边界',`<p>普通节点导出、客户端订阅与“导出为中转上游（仅 TCP）”分别核对；不能将普通分享配置视为已通过上游导入资格。</p>${go('返回节点列表','/nodes')}`)}`;}
function routing(r){const t=r.query.get('tab')||'groups';let body='';if(t==='groups')body=`${select('mode','网络模式',['常规分流：国内直连，其余走 PROXY','默认直连：仅指定服务走代理'],'常规分流：国内直连，其余走 PROXY')}<p class="hint">常规模式需要客户端 GeoSite / GeoIP 数据；默认直连不依赖这些数据。</p>${table(['策略组','来源 / 节点','说明'],[['PROXY','订阅明确选择的节点','由现有导出规则生成'],['服务预设','ToClash 固定 40 项目录','下方为目录结构示例；实现时完整保留 40 项']])}<div class="rule"></div><h3>服务预设 · 目录结构示例</h3><div class="grid">${check('preset1','服务 A（示例预设）',true)}${check('preset2','服务 B（示例预设）',true)}${check('preset3','服务 C（示例预设）')}${check('preset4','服务 D（示例预设）')}</div><p class="hint">此处四个为占位，正式界面沿用现有 40 项，不新增任意策略组编辑能力。共享登录域名可能关联多个服务；关闭预设不等于强制直连。</p>`;
if(t==='dns')body=`${note('企业 / 家庭内网 DNS 为可选配置。示例不是你的网络；需要系统 DNS 时明确填写 system。')}${table(['域名后缀','DNS 服务器','操作'],[['corp.example.test','system',btn('移除示例区域','demo-remove')]])}<div class="form-grid">${field('zone','新增域名后缀','','例如 corp.example.test')}${field('nameserver','DNS 服务器','','每行一个实际可达地址，或明确填写 system')}</div>${btn('添加区域到草稿（演示）','dirty')}${check('cgnat','将 100.64.0.0/10（CGNAT）加入本地直连',true)}`;
if(t==='rules')body=`<div class="grid">${area('direct','始终直连','intranet.example.test','每行一个域名、网址或 IP；示例数据')}${area('proxy_rules','始终代理','service.example.test','每行一个域名、网址或 IP；示例数据')}</div>${note('手工规则、服务预设和内网规则按现有生成顺序处理；在只读预览核对实际输出。不在本轮另建通用规则引擎。')}${table(['顺序示例','匹配','策略'],[['01','内网区域 / 手工直连','DIRECT'],['02','明确代理 / 预设','PROXY'],['最后','未匹配目标','由网络模式决定']])}`;
if(t==='preview')body=`${note('这是固定示例片段，不是当前草稿的真实编译结果；正式界面预览须显示生成时间、规则数量和警告。')}<pre class="code"># 示例 · 只读 Mihomo 配置节选\nproxy-groups:\n  - name: PROXY\n    type: select\n    proxies: [示例节点]\nrules:\n  - DOMAIN-SUFFIX,intranet.example.test,DIRECT\n  - DOMAIN-SUFFIX,service.example.test,PROXY\n  - MATCH,PROXY</pre>${btn('独立 YAML 结构 / 差异预览','yaml')}`;

function renderModal(name){const [h,b,f,cls='']=modalContent(name);$('#modal-root').innerHTML=`<div class="modal-backdrop"><section role="dialog" aria-modal="true" aria-labelledby="modal-title" class="modal ${cls}"><header class="modal-head"><h2 id="modal-title">${h}</h2>${btn('关闭','close')}</header><div class="modal-body">${b}</div><footer class="modal-footer">${f}</footer></section></div>`;requestAnimationFrame(()=>$('#modal-root button, #modal-root a, #modal-root input')?.focus());}
function cacheDrafts(){document.querySelectorAll('[data-draft]').forEach(container=>{const target=drafts[container.dataset.draft];if(!target)return;container.querySelectorAll('[name]').forEach(el=>{if(el.type==='password'||el.name==='source')return;target[el.name]=el.type==='checkbox'?el.checked:el.value;});});}
function restoreDrafts(){document.querySelectorAll('[data-draft]').forEach(container=>{const target=drafts[container.dataset.draft];if(!target)return;container.querySelectorAll('[name]').forEach(el=>{if(el.type==='password'||el.name==='source'||!(el.name in target))return;if(el.type==='checkbox')el.checked=!!target[el.name];else el.value=target[el.name];});});}
function run(action){const dialogActions=['index','share','export','delete-node','apply-node','grant','issued','revoke','rotate','import','import-preview','apply-proxy','yaml','certificate-apply','bind','renew','restart','account-save','logout','diagnostic','readiness','unavailable'];if(dialogActions.includes(action)){cacheDrafts();showModal(action);return;}switch(action){case'close':closeModal();break;case'drawer':drawer=!drawer;$('#preview').classList.toggle('drawer-open',drawer);break;case'phone':cacheDrafts();phone=!phone;document.body.classList.toggle('phone-review',phone);$('#phone-toggle').setAttribute('aria-pressed',String(phone));$('#phone-toggle').textContent=phone?'返回桌面宽度':'手机宽度预览';render();restoreDrafts();break;case'filter-nodes':nodeFilter.search=$('#node-search').value;nodeFilter.protocol=$('#node-protocol').value;render();break;case'clear-filter':nodeFilter.search='';nodeFilter.protocol='全部协议';render();break;case'discard':resetDraft(formKey(parse('#'+current)));dirty=false;$('#modal-root').innerHTML='';navigate(pending||'/overview');pending='';break;case'dirty':cacheDrafts();dirty=true;toast('已修改本标签页内存草稿（演示）');break;case'demo-remove':dirty=true;toast('移除动作占位，未修改真实区域');break;case'reset-state':scenario='normal';$('#scenario').value=scenario;render();restoreDrafts();break;case'login-failure':$('#login-message').innerHTML=note('登录失败：用户名或密码不正确（示例）。保留用户名，清空密码；不泄露账户是否存在。');document.querySelector('[name=login_password]').value='';break;case'login-success':scenario='normal';$('#scenario').value=scenario;navigate(returnTo);toast('模拟登录成功；未验证账户，已返回允许的站内目标');break;case'save-account':dirty=false;drafts.account={};returnTo='/account';closeModal();setTimeout(()=>navigate('/login'),30);toast('账户保存流程示例；没有保存真实用户名或密码');break;case'logout-demo':closeModal();setTimeout(()=>navigate('/login'),30);break;case'save-node':cacheDrafts();resetDraft('node');dirty=false;closeModal();setTimeout(()=>navigate('/nodes'),30);toast('节点保存成功状态示例；未写服务器');break;case'demo-delete':closeModal();setTimeout(()=>navigate('/nodes'),30);toast('删除结果示例；列表数据未被真实删除');break;case'save-routing':cacheDrafts();dirty=false;render();restoreDrafts();toast('分流已保存状态示例；没有生成或应用真实配置');break;case'save-proxy':cacheDrafts();dirty=false;proxyChecked=false;render();restoreDrafts();toast('草稿已保存状态示例；活动配置未改变');break;case'check-proxy':cacheDrafts();proxyChecked=true;render();restoreDrafts();toast('检查通过状态示例；未执行核心或线路检查');break;case'apply-proxy-demo':dirty=false;closeModal();toast('应用结果示例；没有改变活动配置或网络');break;case'import-next':cacheDrafts();showModal('import-preview');break;case'save-import':draftImport=true;dirty=true;drafts.import={};closeModal();toast('上游保存到草稿状态示例；没有解析或连接输入');break;case'issue-grant':cacheDrafts();drafts.grant={};showModal('issued');break;case'issue-certificate':dirty=false;drafts.certificate={};closeModal();setTimeout(()=>navigate('/certificates/detail'),30);toast('签发流程示例；请在详情区分签发与各绑定应用');break;case'renew-demo':closeModal();toast('示例：新材料已签发，部分绑定失败，旧材料仍保留');break;case'restart-demo':closeModal();scenario='processing';$('#scenario').value=scenario;render();break;case'reload-draft':if(dirty)showModal('readiness');else toast('重新载入示例；没有读取服务器');break;case'reload-confirm':resetDraft(formKey());dirty=false;scenario='normal';$('#scenario').value=scenario;closeModal();render();toast('已放弃本次草稿的状态演示；真实服务器未读取');break;case'copy-demo':toast('复制反馈示例；没有写入系统剪贴板');break;case'demo-export':toast('导出反馈示例；没有生成或下载文件');break;case'demo-preview':toast('固定示例报告已显示；没有实际解析 YAML');break;case'demo-refresh':toast('刷新状态反馈示例；没有读取或重启服务');break;default:closeModal();toast('操作完成状态示例；没有调用真实服务');}}
document.addEventListener('click',e=>{const link=e.target.closest('[data-go]');if(link){e.preventDefault();cacheDrafts();drawer=false;const target=link.dataset.go;if(route().page==='login'&&!target.startsWith('/login'))returnTo=target;if(target==='/login'&&route().page!=='login')returnTo=internalTarget();navigate(target);return;}const action=e.target.closest('[data-action]');if(action){e.preventDefault();run(action.dataset.action);}});
document.addEventListener('input',e=>{if(e.target.closest('[data-draft]')){cacheDrafts();if(!e.target.closest('.modal'))dirty=true;}});
document.addEventListener('change',e=>{if(e.target.name==='export_use'){const formats=document.querySelector('[name=export_format]');formats.innerHTML=(e.target.value==='导出为中转上游（仅 TCP）'?['URI','单节点 Clash YAML']:['URI','单节点 Clash YAML','sing-box JSON（普通节点资格）']).map(x=>'<option>'+x+'</option>').join('');return;}if(e.target.id==='scenario'){cacheDrafts();scenario=e.target.value;if(scenario==='expired'&&route().page!=='login')returnTo=internalTarget();render();restoreDrafts();return;}if(e.target.closest('[data-draft]')){cacheDrafts();if(!e.target.closest('.modal'))dirty=true;if(['protocol','core','security','transport','host','relay'].includes(e.target.name)){const d=drafts.node;if(d.core==='Xray'&&['Hysteria2','TUIC'].includes(d.protocol))d.protocol='VLESS';if(['Hysteria2','TUIC'].includes(d.protocol))d.security='TLS';if(d.protocol!=='VLESS'&&d.security==='REALITY')d.security='TLS';if(d.protocol==='VLESS'&&d.security==='REALITY'){d.core='sing-box';d.transport='TCP';}render();restoreDrafts();}}});
document.addEventListener('submit',e=>e.preventDefault());
document.addEventListener('keydown',e=>{const modal=$('#modal-root .modal');if(e.key==='Escape'){if(modal)closeModal();else if(drawer)run('drawer');}if(e.key==='Tab'&&modal){const focusables=[...modal.querySelectorAll('button,a,input,select,textarea,[tabindex]')].filter(el=>!el.disabled&&el.offsetParent!==null);if(!focusables.length)return;const first=focusables[0],last=focusables.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
window.addEventListener('hashchange',()=>{const next=location.hash.replace(/^#/,'')||'/overview';const old=parse('#'+current),now=parse('#'+next);const modalOnly=old.path===now.path&&(old.query.has('modal')||now.query.has('modal'));if(dirty&&!sameForm(current,next)&&!modalOnly){pending=next;history.replaceState(null,'','#'+current);renderModal('dirty');return;}if(!old.query.has('modal'))scrollPositions.set(old.path,window.scrollY);current=next;drawer=false;render();restoreDrafts();if(!now.query.has('modal'))requestAnimationFrame(()=>window.scrollTo(0,scrollPositions.get(now.path)||0));});
if(!location.hash)history.replaceState(null,'','#/overview');current=location.hash.replace(/^#/,'');render();restoreDrafts();
</script>
</body>
</html>
