name: Published one-line installation acceptance
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published stable VERSION, for example 0.4.9
        required: true
        type: string
      commit:
        description: Exact published source commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  published-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ inputs.commit }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact published test checkout
        env:
          SOURCE: ${{ inputs.commit }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          test "$(cat VERSION)" = "$VERSION"
      - run: pip install -r requirements-test.txt
      - name: Install from anonymous public HTTPS and reopen the global menu
        env:
          VUI_SYSTEM_INSTALL_TEST: '1'
          VUI_INSTALLER_YN_TEST: '1'
          VUI_DOMAIN_RETRY_TEST: '1'
          VUI_PUBLISHED_INSTALL_VERSION: ${{ inputs.version }}
          VUI_RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p test_oneclick_system.py -v 2>&1 | tee /tmp/vui-published-install.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: vui-published-install-${{ inputs.commit }}
          path: /tmp/vui-published-install.log
          retention-days: 14
