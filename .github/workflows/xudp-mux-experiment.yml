name: Isolated bounded XUDP mux experiment
on:
  push:
    branches: [experiment/xudp-mux-lifecycle-20261017]
permissions:
  contents: read
jobs:
  mux-experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SagerNet/sing-box
          ref: af6e64c3b69e6132ebaee0e1a3d24e93903f6709
          path: .experiment-source/sing-box
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SagerNet/sing-vmess
          ref: 31ec11e8790c48a4bf11711806a61e929ee6b89d
          path: .experiment-source/sing-vmess
          persist-credentials: false
      - name: Use the existing fixed runner Go compiler
        run: |
          set -euo pipefail
          GO_BIN="$RUNNER_TOOL_CACHE/go/1.25.14/x64/bin"
          test "$(GOTOOLCHAIN=local "$GO_BIN/go" version)" = 'go version go1.25.14 linux/amd64'
          printf '%s\n' "$GO_BIN" >> "$GITHUB_PATH"
      - name: Validate frozen boundaries and Python controls
        run: |
          python3 - <<'PY'
          import unittest
          suite = unittest.TestLoader().discover('experiments/xudp_mux', pattern='test_*.py')
          assert suite.countTestCases() == 38, 'Missing or unexpected Python controls'
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful() and not result.skipped, 'Controls failed or skipped'
          PY
      - name: Compile and exercise two actual-route arms plus bounded mux race and debug tests
        run: |
          set -euo pipefail
          python3 experiments/xudp_mux/build_and_test.py \
            --sing-box .experiment-source/sing-box \
            --sing-vmess .experiment-source/sing-vmess \
            --output /tmp/vui-xudp-mux
      - name: Preserve test evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vui-xudp-mux-evidence
          path: /tmp/vui-xudp-mux/evidence
          retention-days: 7
          if-no-files-found: warn

  runtime-matrix:
    needs: mux-experiment
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SagerNet/sing-box
          ref: af6e64c3b69e6132ebaee0e1a3d24e93903f6709
          path: .experiment-source/sing-box
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SagerNet/sing-vmess
          ref: 31ec11e8790c48a4bf11711806a61e929ee6b89d
          path: .experiment-source/sing-vmess
          persist-credentials: false
      - name: Use the existing fixed runner Go compiler
        run: |
          set -euo pipefail
          GO_BIN="$RUNNER_TOOL_CACHE/go/1.25.14/x64/bin"
          test "$(GOTOOLCHAIN=local "$GO_BIN/go" version)" = 'go version go1.25.14 linux/amd64'
          printf '%s\n' "$GO_BIN" >> "$GITHUB_PATH"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: vui-xudp-mux-evidence
          path: /tmp/vui-xudp-mux-mechanism
      - name: Install existing test dependencies and verify runtime controls
        run: |
          pip install -r requirements-test.txt
          python3 - <<'PY'
          import unittest
          suite = unittest.TestLoader().discover('experiments/xudp_mux/runtime', pattern='test_*.py')
          assert suite.countTestCases() == 26, 'Missing or unexpected runtime controls'
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful() and not result.skipped
          PY
      - name: Fetch unchanged official peer and device binaries
        run: |
          python3 scripts/fetch_test_cores.py /tmp/vui-xudp-mux-official/cores
          python3 scripts/fetch_mihomo.py /tmp/vui-xudp-mux-official/client
      - name: Build runtime candidates and require exact mechanism source equivalence
        run: |
          python3 experiments/xudp_mux/runtime/build_candidates.py             --sing-box .experiment-source/sing-box             --sing-vmess .experiment-source/sing-vmess             --output /tmp/vui-xudp-mux-candidates
          python3 experiments/xudp_mux/runtime/compare_mechanism.py             --mechanism /tmp/vui-xudp-mux-mechanism             --candidates /tmp/vui-xudp-mux-candidates
      - name: Run original RED ledger and real lifecycle VMess and shared TCP compatibility
        env:
          VUI_TEST_CORES: /tmp/vui-xudp-mux-official/cores
          VUI_TEST_MIHOMO: /tmp/vui-xudp-mux-official/client/mihomo
        run: |
          export VUI_DATA_DIR="$(mktemp -d)"
          python3 experiments/xudp_mux/runtime/run_matrix.py             --candidates /tmp/vui-xudp-mux-candidates             --output /tmp/vui-xudp-mux-runtime
      - name: Prepare strictly allowlisted runtime text evidence
        if: always()
        id: evidence
        run: |
          python3 experiments/xudp_mux/runtime/prepare_evidence.py             --runtime /tmp/vui-xudp-mux-runtime             --build /tmp/vui-xudp-mux-candidates/evidence             --output /tmp/vui-xudp-mux-runtime-upload
      - name: Preserve runtime evidence without experimental binaries
        if: ${{ !cancelled() && steps.evidence.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vui-xudp-mux-runtime-evidence
          path: /tmp/vui-xudp-mux-runtime-upload
          retention-days: 7
          if-no-files-found: error
  packet-experiment:
    needs: mux-experiment
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SagerNet/sing-box
          ref: af6e64c3b69e6132ebaee0e1a3d24e93903f6709
          path: .experiment-source/sing-box
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SagerNet/sing-vmess
          ref: 31ec11e8790c48a4bf11711806a61e929ee6b89d
          path: .experiment-source/sing-vmess
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SagerNet/sing
          ref: 87c33f17688fe3dd80eeabef7c3f7a69152ccd42
          path: .experiment-source/sing
          persist-credentials: false
      - name: Use existing fixed runner Go compiler
        run: |
          set -euo pipefail
          GO_BIN="$RUNNER_TOOL_CACHE/go/1.25.14/x64/bin"
          test "$(GOTOOLCHAIN=local "$GO_BIN/go" version)" = 'go version go1.25.14 linux/amd64'
          printf '%s\n' "$GO_BIN" >> "$GITHUB_PATH"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: vui-xudp-mux-evidence
          path: /tmp/vui-packet-mechanism
      - name: Install existing pinned test dependencies before socket controls
        run: pip install -r requirements-test.txt
      - name: Verify packet evidence controls
        run: |
          python3 - <<'PY'
          import unittest
          suite = unittest.TestLoader().discover('experiments/xudp_packet', pattern='test_*.py')
          assert suite.countTestCases() == 179
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful() and not result.skipped
          PY
      - name: Build complete-packet candidate and run bounded receive race debug and cross-compiles
        run: |
          python3 experiments/xudp_packet/build_and_test.py \
            --sing-box .experiment-source/sing-box \
            --sing-vmess .experiment-source/sing-vmess \
            --sing .experiment-source/sing \
            --mechanism /tmp/vui-packet-mechanism \
            --output /tmp/vui-packet-build
      - name: Fetch unchanged official control
        run: |
          python3 scripts/fetch_test_cores.py /tmp/vui-packet-official/cores
      - name: Run stock-role diagnostic and complete experimental-role capacity stages
        run: |
          python3 experiments/xudp_packet/run_runtime.py \
            --build /tmp/vui-packet-build \
            --official /tmp/vui-packet-official/cores/sing-box \
            --output /tmp/vui-packet-runtime
      - name: Prepare packet text evidence without source trees or binaries
        if: always()
        id: evidence
        run: |
          python3 experiments/xudp_packet/prepare_evidence.py \
            --build /tmp/vui-packet-build/evidence \
            --runtime /tmp/vui-packet-runtime \
            --output /tmp/vui-packet-upload
      - name: Preserve packet experiment evidence
        if: ${{ !cancelled() && steps.evidence.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vui-complete-packet-evidence
          path: /tmp/vui-packet-upload
          retention-days: 7
          if-no-files-found: error

  socks-owner-experiment:
    needs: mux-experiment
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SagerNet/sing-box
          ref: af6e64c3b69e6132ebaee0e1a3d24e93903f6709
          path: .experiment-source/sing-box
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SagerNet/sing-vmess
          ref: 31ec11e8790c48a4bf11711806a61e929ee6b89d
          path: .experiment-source/sing-vmess
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SagerNet/sing
          ref: 87c33f17688fe3dd80eeabef7c3f7a69152ccd42
          path: .experiment-source/sing
          persist-credentials: false
      - name: Use existing fixed runner Go compiler
        run: |
          set -euo pipefail
          GO_BIN="$RUNNER_TOOL_CACHE/go/1.25.14/x64/bin"
          test "$(GOTOOLCHAIN=local "$GO_BIN/go" version)" = 'go version go1.25.14 linux/amd64'
          printf '%s\n' "$GO_BIN" >> "$GITHUB_PATH"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: vui-xudp-mux-evidence
          path: /tmp/vui-owner-mechanism
      - name: Install existing pinned test dependencies before socket controls
        run: pip install -r requirements-test.txt
      - name: Verify opt-in owner source and evidence controls
        run: |
          python3 - <<'PYTHON'
          import unittest
          suite = unittest.TestLoader().discover('experiments/socks_idle_recovery', pattern='test_*.py')
          assert suite.countTestCases() == 159
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful() and not result.skipped
          PYTHON
      - name: Build independently identified base and complete owner candidate
        run: |
          python3 experiments/socks_idle_recovery/build_and_test.py \
            --sing-box .experiment-source/sing-box \
            --sing-vmess .experiment-source/sing-vmess \
            --sing .experiment-source/sing \
            --mechanism /tmp/vui-owner-mechanism \
            --output /tmp/vui-owner-build
      - name: Fetch unchanged official control for owner off and on arms
        run: python3 scripts/fetch_test_cores.py /tmp/vui-owner-official/cores
      - name: Run frozen owner-off matrix and same-association owner-on C and D
        run: |
          python3 experiments/socks_idle_recovery/run_owner_runtime.py \
            --repository "$PWD" \
            --build /tmp/vui-owner-build \
            --official /tmp/vui-owner-official/cores/sing-box \
            --output /tmp/vui-owner-runtime
      - name: Prepare allowlisted owner mechanism and runtime evidence
        if: always()
        id: evidence
        run: |
          python3 experiments/socks_idle_recovery/prepare_runtime_evidence.py \
            --build /tmp/vui-owner-build/evidence \
            --runtime /tmp/vui-owner-runtime \
            --output /tmp/vui-owner-upload
      - name: Preserve owner mechanism and runtime text only
        if: ${{ !cancelled() && steps.evidence.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vui-socks-owner-evidence
          path: /tmp/vui-owner-upload
          retention-days: 7
          if-no-files-found: error
