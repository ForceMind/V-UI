name: Public short installer acceptance
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  short-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check out the immutable published suite source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: a39b6e009829dd7f1be772fd3454474903b9858a
          path: .published-suite
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact bootstrap checkout
        env:
          SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE"
      - run: pip install -r requirements-test.txt
      - name: Install public stable suite through the actual short command
        env:
          VUI_SYSTEM_INSTALL_TEST: '1'
          VUI_PUBLISHED_INSTALL_VERSION: '0.4.9'
          VUI_RELEASE_COMMIT: a39b6e009829dd7f1be772fd3454474903b9858a
          VUI_SETUP_INSTALL: '1'
          VUI_INSTALLER_YN_TEST: '1'
          VUI_SETUP_RELEASE_SOURCE: ${{ github.workspace }}/.published-suite
          VUI_SETUP_CHECKOUT: ${{ github.event.pull_request.head.sha || github.sha }}
          VUI_SETUP_REF: ${{ github.ref_name == 'main' && 'main' || github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p test_oneclick_system.py -v 2>&1 | tee /tmp/vui-short-install.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: vui-short-install-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/vui-short-install.log
          retention-days: 14
