name: 中文版直接安装与公网访问验收

on:
  push:
    branches: [3x-ui-zh-lite]
    paths:
      - '.github/workflows/zh-install-check.yml'
      - 'install*.sh'
      - 'scripts/test-zh-systemd.sh'
      - 'scripts/zh-provision.sh'
      - 'internal/config/version'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 从本轮源码构建待测安装包
        run: bash 制作安装包.sh "$RUNNER_TEMP/candidate"
      - uses: actions/upload-artifact@v4
        with:
          name: tested-linux-amd64
          path: ${{ runner.temp }}/candidate/
          compression-level: 0
          retention-days: 3

  verify:
    name: ${{ matrix.mode }} / ${{ matrix.old }}
    runs-on: ubuntu-24.04
    needs: package
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        mode: [migrate, rollback]
        old: ['3.11.0', '2.9.2']
        include:
          - mode: fresh
            old: '3.11.0'
          - mode: fresh-tls
            old: '3.11.0'
          - mode: fresh-tls-fallback
            old: '3.11.0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: tested-linux-amd64
          path: ${{ runner.temp }}/candidate/
      - name: 校验候选安装包并取得官方测试归档
        env:
          OLD_VERSION: ${{ matrix.old }}
        run: |
          cd "$RUNNER_TEMP/candidate"
          sha256sum --check --strict -- *.sha256
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 15 --max-time 300 \
            --output "$RUNNER_TEMP/official.tar.gz" \
            "https://github.com/MHSanaei/3x-ui/releases/download/v$OLD_VERSION/x-ui-linux-amd64.tar.gz"
      - name: 在空白主机上运行真实服务
        env:
          OLD_VERSION: ${{ matrix.old }}
          TEST_MODE: ${{ matrix.mode }}
        run: |
          candidate="$RUNNER_TEMP/candidate/3x-ui-v$(cat internal/config/version)-linux-amd64.tar.gz"
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS,ImageOS,RUNNER_TEMP,GITHUB_RUN_ID \
            env XUI_CI_SYSTEMD_TEST=DISPOSABLE_GITHUB_RUNNER \
            bash scripts/test-zh-systemd.sh "$TEST_MODE" "$candidate" "$RUNNER_TEMP/official.tar.gz" "$OLD_VERSION"
