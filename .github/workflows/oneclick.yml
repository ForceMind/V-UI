name: One-command installation acceptance
on:
  pull_request:
  push:
    branches: [main, dev]
permissions:
  contents: read
jobs:
  build-kit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      identity: ${{ steps.identity.outputs.identity }}
      source-sha: ${{ steps.identity.outputs.source-sha }}
      version: ${{ steps.identity.outputs.version }}
      checksums-sha256: ${{ steps.identity.outputs.checksums-sha256 }}
      bundle-sha256: ${{ steps.identity.outputs.bundle-sha256 }}
      upgrade-matrix: ${{ steps.identity.outputs.upgrade-matrix }}
      artifact-id: ${{ steps.upload-kit.outputs.artifact-id }}
      artifact-digest: ${{ steps.artifact-identity.outputs.artifact-digest }}
      artifact-name: vui-release-kit-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements-test.txt
      - name: Build exact candidate for installer test
        env:
          SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          mkdir -m 700 /tmp/vui-oneclick
          python scripts/build_bundle.py /tmp/vui-oneclick/vui-linux.zip --source-commit "$SOURCE" | tee /tmp/vui-oneclick/build.log
      - name: Assemble exact candidate kit for combined installation acceptance
        env:
          SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/build_release_kit.py /tmp/vui-oneclick/vui-linux.zip /tmp/vui-oneclick/kit "$SOURCE"
      - name: Inspect producer candidate kit
        id: identity
        env:
          SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          VUI_CANDIDATE_VERSION="$(cat VERSION)"
          python -B -m scripts.acceptance_job producer \
            --kit /tmp/vui-oneclick/kit --source "$SOURCE" --version "$VUI_CANDIDATE_VERSION" \
            --identity-output /tmp/vui-oneclick/identity.json
          python - <<'PYOUTPUT'
          import json, os
          with open('/tmp/vui-oneclick/identity.json') as stream:
              identity = json.load(stream)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('identity=' + json.dumps(identity, sort_keys=True, separators=(',', ':')), file=output)
              for key in ('source_sha', 'version', 'checksums_sha256', 'bundle_sha256'):
                  print(key.replace('_', '-') + '=' + identity[key], file=output)
          PYOUTPUT
          VUI_UPGRADE_MATRIX="$(python -B -m scripts.acceptance_job matrix --version "$VUI_CANDIDATE_VERSION")"
          printf 'upgrade-matrix=%s\n' "$VUI_UPGRADE_MATRIX" >> "$GITHUB_OUTPUT"
      - name: Upload release kit
        id: upload-kit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vui-release-kit-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/vui-oneclick/kit
          if-no-files-found: error
          retention-days: 14
      - name: Bind producer artifact identity
        id: artifact-identity
        env:
          PRODUCER_ARTIFACT_DIGEST: ${{ steps.upload-kit.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          case "$PRODUCER_ARTIFACT_DIGEST" in
            sha256:*) ;;
            *) PRODUCER_ARTIFACT_DIGEST="sha256:$PRODUCER_ARTIFACT_DIGEST" ;;
          esac
          printf 'artifact-digest=%s\n' "$PRODUCER_ARTIFACT_DIGEST" >> "$GITHUB_OUTPUT"
      - name: Record producer receipt
        env:
          SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
          CANDIDATE_VERSION: ${{ steps.identity.outputs.version }}
          EXPECTED_CHECKSUMS_SHA256: ${{ steps.identity.outputs.checksums-sha256 }}
          EXPECTED_BUNDLE_SHA256: ${{ steps.identity.outputs.bundle-sha256 }}
          PRODUCER_ARTIFACT_ID: ${{ steps.upload-kit.outputs.artifact-id }}
          PRODUCER_ARTIFACT_DIGEST: ${{ steps.artifact-identity.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          python -B -m scripts.acceptance_job receipt \
            --identity /tmp/vui-oneclick/identity.json --role build \
            --source "$SOURCE" --version "$CANDIDATE_VERSION" \
            --producer-artifact-id "$PRODUCER_ARTIFACT_ID" --producer-artifact-digest "$PRODUCER_ARTIFACT_DIGEST" \
            --expected-checksums-sha256 "$EXPECTED_CHECKSUMS_SHA256" \
            --expected-bundle-sha256 "$EXPECTED_BUNDLE_SHA256" \
            --output /tmp/vui-oneclick/acceptance-receipt.json
      - name: Upload producer receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vui-oneclick-receipt-build-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/vui-oneclick/acceptance-receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload acceptance logs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: vui-oneclick-evidence-build-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/vui-oneclick/*.log
          retention-days: 14

  system-install:
    needs: build-kit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements-test.txt
      - name: Prepare isolated acceptance workspace
        run: mkdir -m 700 /tmp/vui-oneclick
      - name: Download exact candidate kit
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.build-kit.outputs.artifact-id }}
          merge-multiple: true
          path: /tmp/vui-oneclick/kit
      - name: Prepare verified candidate kit
        env:
          SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
          CANDIDATE_VERSION: ${{ needs.build-kit.outputs.version }}
          EXPECTED_CHECKSUMS_SHA256: ${{ needs.build-kit.outputs.checksums-sha256 }}
          EXPECTED_BUNDLE_SHA256: ${{ needs.build-kit.outputs.bundle-sha256 }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          test "$(cat VERSION)" = "$CANDIDATE_VERSION"
          python -B -m scripts.acceptance_job prepare \
            --kit /tmp/vui-oneclick/kit --source "$SOURCE" --version "$CANDIDATE_VERSION" \
            --expected-checksums-sha256 "$EXPECTED_CHECKSUMS_SHA256" \
            --expected-bundle-sha256 "$EXPECTED_BUNDLE_SHA256" \
            --identity-output /tmp/vui-oneclick/identity.json \
            --bundle-output /tmp/vui-oneclick/vui-linux.zip
          cmp /tmp/vui-oneclick/kit/vui-linux-x86_64-gnu.zip /tmp/vui-oneclick/vui-linux.zip
          (
            cd /tmp/vui-oneclick
            sha256sum -c vui-linux.zip.sha256
          )
      - name: Prepare verified official core-switch fixture
        env:
          SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$SOURCE"
          fixture=/tmp/vui-oneclick/core-switch-fixture
          mkdir -m 700 "$fixture"
          for core in sing-box xray; do
            mkdir -m 700 "$fixture/$core"
            python -B scripts/fetch_core_candidate_inputs.py --workspace "$fixture/$core" \
              --core "$core" --builder-source "$SOURCE" --output inputs > "/tmp/vui-oneclick/core-switch-fetch-$core.log"
          done
          python -B - <<'PY'
          import json
          import os
          from pathlib import Path
          from app.core_updates import artifacts
          from scripts import build_core_component as producer
          from scripts.acceptance_job import CORE_SWITCH_CORES, CORE_SWITCH_FIXTURE

          for core in CORE_SWITCH_CORES:
              work = CORE_SWITCH_FIXTURE / core
              expected_path = Path('inputs/expected.json')
              expected = json.loads((work / expected_path).read_bytes())
              assert expected['core'] == core
              assert expected['builder_source'] == os.environ['SOURCE']
              assert expected['compatibility']['app_sources'] == [os.environ['SOURCE']]
              packs = {}
              for target in artifacts.TARGETS:
                  row = next(item for item in expected['upstream']['archives'] if item['target'] == target)
                  directory = Path('target-' + target)
                  record = producer.build_target(work, expected_path, target=target,
                      archive=Path('inputs') / row['archive_name'], source=Path('inputs/SOURCE.tar.gz'),
                      destination=directory)
                  packs[target] = directory / record['name']
              producer.assemble(work, expected_path, packs=packs, destination=Path('candidate'))
          PY
      - name: Test interactive installer and global v-ui on ephemeral systemd runner
        env:
          SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
          CANDIDATE_VERSION: ${{ needs.build-kit.outputs.version }}
          EXPECTED_CHECKSUMS_SHA256: ${{ needs.build-kit.outputs.checksums-sha256 }}
          EXPECTED_BUNDLE_SHA256: ${{ needs.build-kit.outputs.bundle-sha256 }}
          ACCEPTANCE_ROLE: fresh
        run: |
          set -euo pipefail
          python -B -m scripts.acceptance_job run-test \
            --role "$ACCEPTANCE_ROLE" --source "$SOURCE" --version "$CANDIDATE_VERSION" \
            --identity /tmp/vui-oneclick/identity.json --log /tmp/vui-oneclick/acceptance.log --core-switch
      - name: Record acceptance receipt
        env:
          SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
          CANDIDATE_VERSION: ${{ needs.build-kit.outputs.version }}
          EXPECTED_CHECKSUMS_SHA256: ${{ needs.build-kit.outputs.checksums-sha256 }}
          EXPECTED_BUNDLE_SHA256: ${{ needs.build-kit.outputs.bundle-sha256 }}
          ACCEPTANCE_ROLE: fresh
          PRODUCER_ARTIFACT_ID: ${{ needs.build-kit.outputs.artifact-id }}
          PRODUCER_ARTIFACT_DIGEST: ${{ needs.build-kit.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          python -B -m scripts.acceptance_job receipt \
            --identity /tmp/vui-oneclick/identity.json --role "$ACCEPTANCE_ROLE" \
            --source "$SOURCE" --version "$CANDIDATE_VERSION" \
            --producer-artifact-id "$PRODUCER_ARTIFACT_ID" --producer-artifact-digest "$PRODUCER_ARTIFACT_DIGEST" \
            --expected-checksums-sha256 "$EXPECTED_CHECKSUMS_SHA256" \
            --expected-bundle-sha256 "$EXPECTED_BUNDLE_SHA256" \
            --test-log /tmp/vui-oneclick/acceptance.log --output /tmp/vui-oneclick/acceptance-receipt.json
      - name: Upload acceptance receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vui-oneclick-receipt-fresh-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/vui-oneclick/acceptance-receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload acceptance logs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: vui-oneclick-evidence-fresh-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/vui-oneclick/*.log
          retention-days: 14

  published-upgrade:
    name: published-upgrade-${{ matrix.version }}
    needs: build-kit
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.build-kit.outputs.upgrade-matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check out immutable published v${{ matrix.version }} source for real upgrade acceptance
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ matrix.source }}
          path: ${{ matrix.path }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements-test.txt
      - name: Prepare isolated acceptance workspace
        run: mkdir -m 700 /tmp/vui-oneclick
      - name: Download exact candidate kit
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.build-kit.outputs.artifact-id }}
          merge-multiple: true
          path: /tmp/vui-oneclick/kit
      - name: Prepare verified candidate kit
        env:
          SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
          CANDIDATE_VERSION: ${{ needs.build-kit.outputs.version }}
          EXPECTED_CHECKSUMS_SHA256: ${{ needs.build-kit.outputs.checksums-sha256 }}
          EXPECTED_BUNDLE_SHA256: ${{ needs.build-kit.outputs.bundle-sha256 }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          test "$(cat VERSION)" = "$CANDIDATE_VERSION"
          python -B -m scripts.acceptance_job prepare \
            --kit /tmp/vui-oneclick/kit --source "$SOURCE" --version "$CANDIDATE_VERSION" \
            --expected-checksums-sha256 "$EXPECTED_CHECKSUMS_SHA256" \
            --expected-bundle-sha256 "$EXPECTED_BUNDLE_SHA256" \
            --identity-output /tmp/vui-oneclick/identity.json \
            --bundle-output /tmp/vui-oneclick/vui-linux.zip
          cmp /tmp/vui-oneclick/kit/vui-linux-x86_64-gnu.zip /tmp/vui-oneclick/vui-linux.zip
          (
            cd /tmp/vui-oneclick
            sha256sum -c vui-linux.zip.sha256
          )
      - name: Test published v${{ matrix.version }} to exact candidate upgrade on ephemeral systemd runner
        env:
          SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
          CANDIDATE_VERSION: ${{ needs.build-kit.outputs.version }}
          EXPECTED_CHECKSUMS_SHA256: ${{ needs.build-kit.outputs.checksums-sha256 }}
          EXPECTED_BUNDLE_SHA256: ${{ needs.build-kit.outputs.bundle-sha256 }}
          ACCEPTANCE_ROLE: upgrade-${{ matrix.version }}
          OLD_SOURCE: ${{ github.workspace }}/${{ matrix.path }}
        run: |
          set -euo pipefail
          python -B -m scripts.acceptance_job run-test \
            --role "$ACCEPTANCE_ROLE" --source "$SOURCE" --version "$CANDIDATE_VERSION" \
            --identity /tmp/vui-oneclick/identity.json --log /tmp/vui-oneclick/acceptance.log \
            --old-source "$OLD_SOURCE"
      - name: Record acceptance receipt
        env:
          SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
          CANDIDATE_VERSION: ${{ needs.build-kit.outputs.version }}
          EXPECTED_CHECKSUMS_SHA256: ${{ needs.build-kit.outputs.checksums-sha256 }}
          EXPECTED_BUNDLE_SHA256: ${{ needs.build-kit.outputs.bundle-sha256 }}
          ACCEPTANCE_ROLE: upgrade-${{ matrix.version }}
          PRODUCER_ARTIFACT_ID: ${{ needs.build-kit.outputs.artifact-id }}
          PRODUCER_ARTIFACT_DIGEST: ${{ needs.build-kit.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          python -B -m scripts.acceptance_job receipt \
            --identity /tmp/vui-oneclick/identity.json --role "$ACCEPTANCE_ROLE" \
            --source "$SOURCE" --version "$CANDIDATE_VERSION" \
            --producer-artifact-id "$PRODUCER_ARTIFACT_ID" --producer-artifact-digest "$PRODUCER_ARTIFACT_DIGEST" \
            --expected-checksums-sha256 "$EXPECTED_CHECKSUMS_SHA256" \
            --expected-bundle-sha256 "$EXPECTED_BUNDLE_SHA256" \
            --test-log /tmp/vui-oneclick/acceptance.log --output /tmp/vui-oneclick/acceptance-receipt.json
      - name: Upload acceptance receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vui-oneclick-receipt-upgrade-${{ matrix.version }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/vui-oneclick/acceptance-receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload acceptance logs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: vui-oneclick-evidence-upgrade-${{ matrix.version }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/vui-oneclick/*.log
          retention-days: 14
