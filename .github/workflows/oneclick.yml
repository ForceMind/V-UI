name: One-command installation acceptance
on:
  pull_request:
  push:
    branches: [main, dev]
permissions:
  contents: read
jobs:
  system-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements-test.txt
      - name: Build exact candidate for installer test
        env:
          SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/vui-oneclick
          python scripts/build_bundle.py /tmp/vui-oneclick/vui-linux.zip --source-commit "$SOURCE" | tee /tmp/vui-oneclick/build.log
      - name: Assemble exact candidate kit for combined installation acceptance
        env:
          SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/build_release_kit.py /tmp/vui-oneclick/vui-linux.zip /tmp/vui-oneclick/kit "$SOURCE"
      - name: Fetch fixed client for installed service TCP acceptance
        run: python scripts/fetch_mihomo.py /tmp/vui-oneclick/client
      - name: Test interactive installer and global v-ui on ephemeral systemd runner
        env:
          VUI_NETLINK_SYSTEMD_TEST: '1'
          VUI_TEST_MIHOMO: /tmp/vui-oneclick/client/mihomo
          VUI_SYSTEM_INSTALL_TEST: '1'
          VUI_REMOTE_MAINTENANCE_TEST: '1'
          VUI_DOMAIN_RETRY_TEST: '1'
          VUI_INSTALLER_YN_TEST: '1'
          VUI_EXISTING_INSTALL_TEST: '1'
          VUI_RELEASE_BUNDLE: /tmp/vui-oneclick/vui-linux.zip
          VUI_RELEASE_KIT: /tmp/vui-oneclick/kit
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p test_oneclick_system.py -v 2>&1 | tee /tmp/vui-oneclick/acceptance.log
      - name: Check out immutable published v0.4.14 source for real upgrade acceptance
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: b0cc174d04d05e61277075412586f0ba0dd231db
          path: .published-v0414
      - name: Test published v0.4.14 to exact candidate upgrade on ephemeral systemd runner
        env:
          VUI_SYSTEM_INSTALL_TEST: '1'
          VUI_PUBLISHED_INSTALL_VERSION: '0.4.14'
          VUI_REMOTE_MAINTENANCE_TEST: '1'
          VUI_RELEASE_COMMIT: b0cc174d04d05e61277075412586f0ba0dd231db
          VUI_PUBLISHED_UPGRADE_SOURCE: ${{ github.workspace }}/.published-v0414
          VUI_RELEASE_KIT: /tmp/vui-oneclick/kit
          VUI_RELEASE_BUNDLE: /tmp/vui-oneclick/vui-linux.zip
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p test_oneclick_system.py -v 2>&1 | tee /tmp/vui-oneclick/published-upgrade.log
      - name: Check out immutable published v0.4.15 source for real upgrade acceptance
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: 65b1e75d90de733408101ec280a92be935731baa
          path: .published-v0415
      - name: Test published v0.4.15 to exact candidate upgrade on ephemeral systemd runner
        env:
          VUI_SYSTEM_INSTALL_TEST: '1'
          VUI_PUBLISHED_INSTALL_VERSION: '0.4.15'
          VUI_REMOTE_MAINTENANCE_TEST: '1'
          VUI_RELEASE_COMMIT: 65b1e75d90de733408101ec280a92be935731baa
          VUI_PUBLISHED_UPGRADE_SOURCE: ${{ github.workspace }}/.published-v0415
          VUI_RELEASE_KIT: /tmp/vui-oneclick/kit
          VUI_RELEASE_BUNDLE: /tmp/vui-oneclick/vui-linux.zip
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p test_oneclick_system.py -v 2>&1 | tee /tmp/vui-oneclick/published-v0415-upgrade.log
      - name: Check out immutable published v0.4.16 source for real upgrade acceptance
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: 18fe631bcf69b68425b454db1795a101e0378842
          path: .published-v0416
      - name: Test published v0.4.16 to exact candidate upgrade on ephemeral systemd runner
        env:
          VUI_SYSTEM_INSTALL_TEST: '1'
          VUI_PUBLISHED_INSTALL_VERSION: '0.4.16'
          VUI_REMOTE_MAINTENANCE_TEST: '1'
          VUI_RELEASE_COMMIT: 18fe631bcf69b68425b454db1795a101e0378842
          VUI_PUBLISHED_UPGRADE_SOURCE: ${{ github.workspace }}/.published-v0416
          VUI_RELEASE_KIT: /tmp/vui-oneclick/kit
          VUI_RELEASE_BUNDLE: /tmp/vui-oneclick/vui-linux.zip
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p test_oneclick_system.py -v 2>&1 | tee /tmp/vui-oneclick/published-v0416-upgrade.log
      - name: Check out immutable published v0.4.17 source for real upgrade acceptance
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: 95c201c6e26ed54960f964c675e515890f2eea2a
          path: .published-v0417
      - name: Test published v0.4.17 to exact candidate upgrade on ephemeral systemd runner
        env:
          VUI_SYSTEM_INSTALL_TEST: '1'
          VUI_PUBLISHED_INSTALL_VERSION: '0.4.17'
          VUI_REMOTE_MAINTENANCE_TEST: '1'
          VUI_RELEASE_COMMIT: 95c201c6e26ed54960f964c675e515890f2eea2a
          VUI_PUBLISHED_UPGRADE_SOURCE: ${{ github.workspace }}/.published-v0417
          VUI_RELEASE_KIT: /tmp/vui-oneclick/kit
          VUI_RELEASE_BUNDLE: /tmp/vui-oneclick/vui-linux.zip
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p test_oneclick_system.py -v 2>&1 | tee /tmp/vui-oneclick/published-v0417-upgrade.log
      - name: Check out immutable published v0.4.19 source for real upgrade acceptance
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: a2b9c188658f082b189e77d237787a96eb9cf921
          path: .published-v0419
      - name: Test published v0.4.19 to exact candidate upgrade on ephemeral systemd runner
        env:
          VUI_NETLINK_SYSTEMD_TEST: '1'
          VUI_TEST_MIHOMO: /tmp/vui-oneclick/client/mihomo
          VUI_SYSTEM_INSTALL_TEST: '1'
          VUI_PUBLISHED_INSTALL_VERSION: '0.4.19'
          VUI_REMOTE_MAINTENANCE_TEST: '1'
          VUI_RELEASE_COMMIT: a2b9c188658f082b189e77d237787a96eb9cf921
          VUI_PUBLISHED_UPGRADE_SOURCE: ${{ github.workspace }}/.published-v0419
          VUI_RELEASE_KIT: /tmp/vui-oneclick/kit
          VUI_RELEASE_BUNDLE: /tmp/vui-oneclick/vui-linux.zip
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p test_oneclick_system.py -v 2>&1 | tee /tmp/vui-oneclick/published-v0419-upgrade.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vui-release-kit-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/vui-oneclick/kit
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: vui-oneclick-evidence
          path: /tmp/vui-oneclick/*.log
          retention-days: 14
