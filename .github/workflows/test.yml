name: Test V-UI

on:
  pull_request:
  push:
    branches:
      - feature/dual-core-foundation

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive tracked source only
        run: git archive --format=zip HEAD --output=/tmp/vui-source.zip
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      - name: Compile Python sources
        run: python -m compileall -q app tests main.py
      - name: Check authentication JavaScript
        run: |
          node --check web/js/account.js
          node --check web/js/app.js
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Install test browser
        run: python -m playwright install --with-deps chromium
      - name: Browser authentication smoke
        env:
          VUI_BROWSER_CHECK: "1"
        run: python -m unittest discover -s tests -p test_startup.py -v
      - name: Upload reproducible source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vui-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/vui-source.zip
          retention-days: 1
