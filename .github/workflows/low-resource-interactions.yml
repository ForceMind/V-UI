name: Opt-in UI and export resource diagnostics
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  interactions:
    if: github.event.label.name == 'run-low-resource-interactions'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install -r requirements-test.txt
      - name: Build exact-head offline candidate outside resource limit
        env:
          VUI_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/vui-interactions
          test "$(git rev-parse HEAD)" = "$VUI_SOURCE_COMMIT"
          python scripts/build_bundle.py /tmp/vui-interactions/vui-linux.zip --source-commit "$VUI_SOURCE_COMMIT" | tee /tmp/vui-interactions/build.log
      - name: Install explicit headed browser and Xvfb fixture
        run: |
          python -m playwright install --with-deps chromium
          command -v xvfb-run
      - name: Run actual visibility tabs logout and fixed export diagnostics
        env:
          VUI_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python -B scripts/low_resource_acceptance.py \
            --bundle /tmp/vui-interactions/vui-linux.zip \
            --source-commit "$VUI_SOURCE_COMMIT" \
            --memory-mib 512 --duration-profile interactions \
            --output /tmp/vui-interactions/low-resource-interactions.json
      - name: Preserve diagnostics including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vui-interactions-evidence-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/vui-interactions/*.json
            /tmp/vui-interactions/*.log
          retention-days: 7
