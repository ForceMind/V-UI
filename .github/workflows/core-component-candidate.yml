name: Core component candidate artifacts (unqualified)
on:
  pull_request:
    paths:
      - 'scripts/build_core_component.py'
      - 'scripts/fetch_core_candidate_inputs.py'
      - 'tests/test_core_component_builder.py'
      - 'tests/test_core_candidate_inputs.py'
      - 'app/core_updates/artifacts.py'
      - 'app/core_updates/store.py'
      - 'app/core_updates/github.py'
      - '.github/workflows/core-component-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pure-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Compile and test offline fake contracts only
        run: |
          python -m py_compile scripts/build_core_component.py scripts/fetch_core_candidate_inputs.py tests/test_core_component_builder.py tests/test_core_candidate_inputs.py
          python -m unittest discover -s tests -p test_core_component_builder.py -v
          python -m unittest discover -s tests -p test_core_candidate_inputs.py -v
  candidate:
    needs: pure-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        core: ['sing-box', 'xray']
    env:
      CORE: ${{ matrix.core }}
      EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
      CANDIDATE_WORK: ${{ runner.temp }}/vui-core-${{ matrix.core }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact source and create private candidate workspace
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          git diff --quiet HEAD --
          umask 077
          mkdir -m 700 "$CANDIDATE_WORK"
      - name: Acquire pinned official materials (not native qualification)
        run: |
          umask 077
          python scripts/fetch_core_candidate_inputs.py --workspace "$CANDIDATE_WORK" --core "$CORE" --builder-source "$EXPECTED_SOURCE" --output inputs > "$CANDIDATE_WORK/acquisition-summary.json"
      - name: Build four candidate packs and aggregate without executing cores
        run: |
          umask 077
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from scripts import build_core_component as producer
          from app.core_updates import artifacts as a
          workspace = Path(os.environ['CANDIDATE_WORK'])
          expected = json.loads((workspace / 'inputs/expected.json').read_bytes())
          assert expected['builder_source'] == os.environ['EXPECTED_SOURCE']
          assert expected['compatibility']['app_sources'] == [os.environ['EXPECTED_SOURCE']]
          records, packs = [], {}
          for target in a.TARGETS:
              row = next(item for item in expected['upstream']['archives'] if item['target'] == target)
              output = 'target-' + target
              record = producer.build_target(workspace, Path('inputs/expected.json'), target=target,
                  archive=Path('inputs') / row['archive_name'], source=Path('inputs/SOURCE.tar.gz'),
                  destination=Path(output))
              records.append(record)
              packs[target] = Path(output) / record['name']
          aggregate = producer.assemble(workspace, Path('inputs/expected.json'), packs=packs,
                                         destination=Path('candidate'))
          receipt = dict(schema=1, kind='core-candidate-production-v1', scope='candidate-format-only',
              published=False, qualified=False, builder_source=os.environ['EXPECTED_SOURCE'], core=os.environ['CORE'],
              context=dict(repository=os.environ['GITHUB_REPOSITORY'], repository_id=int(os.environ['GITHUB_REPOSITORY_ID']),
                  run_id=int(os.environ['GITHUB_RUN_ID']), run_attempt=int(os.environ['GITHUB_RUN_ATTEMPT'])),
              acquisition_receipt_sha256=hashlib.sha256((workspace / 'inputs/acquisition-receipt.json').read_bytes()).hexdigest(),
              expected_sha256=hashlib.sha256((workspace / 'inputs/expected.json').read_bytes()).hexdigest(),
              targets=records, aggregate=aggregate)
          with (workspace / 'production-receipt.json').open('x') as output:
              json.dump(receipt, output, sort_keys=True, indent=2)
          print('Candidate artifacts produced; qualified=false, published=false. No core was executed.')
          PY
      - name: Preserve candidate files and bounded acquisition/production evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-candidate-${{ matrix.core }}-${{ env.EXPECTED_SOURCE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.CANDIDATE_WORK }}/candidate/*
            ${{ env.CANDIDATE_WORK }}/inputs/expected.json
            ${{ env.CANDIDATE_WORK }}/inputs/acquisition-receipt.json
            ${{ env.CANDIDATE_WORK }}/acquisition-summary.json
            ${{ env.CANDIDATE_WORK }}/production-receipt.json
          if-no-files-found: warn
          retention-days: 7
