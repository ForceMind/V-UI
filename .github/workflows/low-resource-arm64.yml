name: Opt-in native ARM64 low-resource acceptance
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  arm64:
    if: github.event.label.name == 'run-low-resource-arm64'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install -r requirements-test.txt
      - name: Record native target and build exact-head offline candidate
        env:
          VUI_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/vui-arm64-resource
          test "$(git rev-parse HEAD)" = "$VUI_SOURCE_COMMIT"
          python - <<'PY' | tee /tmp/vui-arm64-resource/host.json
          import json, os, platform
          from app.release_tools import target_key
          assert platform.system() == 'Linux' and platform.machine() == 'aarch64'
          assert target_key() == 'aarch64-gnu'
          print(json.dumps(dict(source_commit=os.environ['VUI_SOURCE_COMMIT'],
              target=target_key(), machine=platform.machine(), kernel=platform.release(),
              libc=platform.libc_ver(), base_page_size_bytes=os.sysconf('SC_PAGE_SIZE'),
              scope='native hosted runner; not a whole 512 MiB ARM64 host')))
          PY
          python scripts/build_bundle.py /tmp/vui-arm64-resource/vui-linux.zip \
            --source-commit "$VUI_SOURCE_COMMIT" --target aarch64-gnu \
            2>&1 | tee /tmp/vui-arm64-resource/build.log
      - name: Verify native ARM64 bundle under one CPU and 512 MiB
        env:
          VUI_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python -B scripts/low_resource_acceptance.py \
            --bundle /tmp/vui-arm64-resource/vui-linux.zip \
            --source-commit "$VUI_SOURCE_COMMIT" --memory-mib 512 \
            --output /tmp/vui-arm64-resource/low-resource-512.json
      - name: Verify native ARM64 bundle under one CPU and 384 MiB
        env:
          VUI_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python -B scripts/low_resource_acceptance.py \
            --bundle /tmp/vui-arm64-resource/vui-linux.zip \
            --source-commit "$VUI_SOURCE_COMMIT" --memory-mib 384 \
            --output /tmp/vui-arm64-resource/low-resource-384.json
      - name: Verify native ARM64 bundle under one CPU and 320 MiB
        env:
          VUI_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python -B scripts/low_resource_acceptance.py \
            --bundle /tmp/vui-arm64-resource/vui-linux.zip \
            --source-commit "$VUI_SOURCE_COMMIT" --memory-mib 320 \
            --output /tmp/vui-arm64-resource/low-resource-320.json
      - name: Preserve native ARM64 evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vui-arm64-resource-evidence-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/vui-arm64-resource/*.json
            /tmp/vui-arm64-resource/*.log
          retention-days: 7
