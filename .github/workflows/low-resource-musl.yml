name: Opt-in native musl container resource acceptance
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  musl:
    if: github.event.label.name == 'run-low-resource-musl'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build native musl bundle outside resource limit
        env:
          SOURCE: ${{ github.event.pull_request.head.sha }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          mkdir -p /tmp/vui-musl-resource/input /tmp/vui-musl-resource/image
          docker run --rm -e SOURCE="$SOURCE" -e ARCH="$ARCH" \
            -v "$PWD:/src:ro" -v /tmp/vui-musl-resource/input:/out \
            alpine:3.22 /bin/sh -euxc '
              apk add --no-cache python3 python3-dev py3-pip git cargo rust build-base libffi-dev openssl-dev ca-certificates
              git config --global --add safe.directory /src
              cd /src
              python3 scripts/build_bundle.py /out/vui-linux.zip --source-commit "$SOURCE" --target "${ARCH}-musl"
              chmod 0644 /out/vui-linux.zip /out/vui-linux.zip.sha256
            ' 2>&1 | tee /tmp/vui-musl-resource/build.log
      - name: Prepare independent harness dependencies outside resource limit
        run: |
          set -euo pipefail
          cp requirements-runtime.txt /tmp/vui-musl-resource/image/
          cp scripts/low_resource_harness.Dockerfile /tmp/vui-musl-resource/image/Dockerfile
          docker build --build-arg HARNESS_UID="$(id -u)" --build-arg HARNESS_GID="$(id -g)" \
            -t vui-resource-harness /tmp/vui-musl-resource/image \
            2>&1 | tee /tmp/vui-musl-resource/harness-build.log
      - name: Verify real container one CPU 512 MiB and zero swap
        env:
          SOURCE: ${{ github.event.pull_request.head.sha }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          python -B scripts/low_resource_docker.py --image vui-resource-harness \
            --bundle /tmp/vui-musl-resource/input/vui-linux.zip \
            --source-commit "$SOURCE" --target "${ARCH}-musl" \
            --memory-mib 512 --output /tmp/vui-musl-resource/limited \
            2>&1 | tee /tmp/vui-musl-resource/coordinator.log
      - name: Preserve native musl evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vui-musl-resource-evidence-${{ matrix.arch }}-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/vui-musl-resource/*.log
            /tmp/vui-musl-resource/limited/*.json
            /tmp/vui-musl-resource/limited/*.log
          retention-days: 7
