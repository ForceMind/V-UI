name: Opt-in certificate and traffic resource overlap
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  certificates:
    if: github.event.label.name == 'run-low-resource-certificates'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install -r requirements-test.txt
      - name: Build exact-head offline candidate outside resource limit
        env:
          VUI_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/vui-certificates
          test "$(git rev-parse HEAD)" = "$VUI_SOURCE_COMMIT"
          python scripts/build_bundle.py /tmp/vui-certificates/vui-linux.zip --source-commit "$VUI_SOURCE_COMMIT" | tee /tmp/vui-certificates/build.log
      - name: Verify official fixed local Pebble CA
        run: python scripts/fetch_pebble.py /tmp/vui-pebble
      - name: Run real fake-CA issuance and automatic renewal during traffic
        env:
          VUI_TEST_PEBBLE: /tmp/vui-pebble/pebble
          VUI_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python -B scripts/low_resource_acceptance.py \
            --bundle /tmp/vui-certificates/vui-linux.zip \
            --source-commit "$VUI_SOURCE_COMMIT" \
            --memory-mib 512 --duration-profile certificates \
            --output /tmp/vui-certificates/low-resource-certificates.json
      - name: Preserve diagnostics including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vui-certificates-evidence-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/vui-certificates/*.json
            /tmp/vui-certificates/*.log
            /tmp/vui-pebble/provenance.json
          retention-days: 7
