name: ACME certificate acceptance
on:
  pull_request:
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Resolve exact Certbot dependency additions
        run: |
          mkdir -p /tmp/vui-acme
          pip download --only-binary=:all: --dest /tmp/vui-acme/wheels -r requirements-runtime.txt certbot==5.8.0
          python scripts/inspect_acme_dependencies.py /tmp/vui-acme
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vui-acme-test-dependencies
          path: /tmp/vui-acme
          retention-days: 2
