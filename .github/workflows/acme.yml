name: ACME certificate acceptance
on:
  pull_request:
permissions:
  contents: read
jobs:
  certificates:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install exact ACME runtime and test dependencies
        run: pip install -r requirements-test.txt
      - name: Verify official fixed Pebble binary
        run: python scripts/fetch_pebble.py /tmp/vui-pebble
      - name: Test actual Certbot HTTP-01 issuance and failure
        env:
          VUI_TEST_PEBBLE: /tmp/vui-pebble/pebble
        run: |
          set -euo pipefail
          export VUI_DATA_DIR="$(mktemp -d)"
          python -m unittest discover -s tests -p test_acme_real.py -v 2>&1 | tee /tmp/vui-pebble/acme.log
      - name: Install explicit test browser
        run: python -m playwright install --with-deps chromium
      - name: Test graphical certificate lifecycle against Pebble
        env:
          VUI_TEST_PEBBLE: /tmp/vui-pebble/pebble
          VUI_CERT_BROWSER: '1'
        run: |
          set -euo pipefail
          export VUI_DATA_DIR="$(mktemp -d)"
          python -m unittest discover -s tests -p test_certificate_browser.py -v 2>&1 | tee /tmp/vui-pebble/browser.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: vui-acme-evidence
          path: |
            /tmp/vui-pebble/provenance.json
            /tmp/vui-pebble/*.log
          retention-days: 7
