name: 中文版一次性安装与迁移验证

on:
  push:
    branches: [3x-ui-zh-lite]
    paths:
      - '.github/workflows/zh-migration-check.yml'
      - 'scripts/test-zh-systemd.sh'
      - 'scripts/zh-*.sh'
      - 'install*.sh'
      - 'update.sh'
      - 'x-ui.sh'
      - 'packages/*-zh.4-linux-amd64.tar.gz'
      - 'packages/*-zh.4-linux-amd64.tar.gz.sha256'

permissions:
  contents: read

jobs:
  package:
    name: 固定本轮待测安装包
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 从已核验的程序和当前安装脚本组包
        shell: bash
        run: |
          set -euo pipefail
          source_rev=2c714036b6a0508790f4c33ef2d62f9559339d7e
          filename=3x-ui-v3.11.0-zh.4-linux-amd64.tar.gz
          git fetch --no-tags --depth=1 origin "$source_rev"
          # 这些输入共同决定已构建的面板和嵌入资源。若有改动必须重新编译。
          git diff --exit-code "$source_rev" HEAD -- '*.go' go.mod go.sum frontend internal scripts/install-amneziawg-kernel.sh
          printf '%s  %s\n' a12b8a25ebf1d98ceac593fd72f1fc2823f06d1a915402a520643a50571834ab "packages/$filename" | sha256sum --check --strict
          tar -xzf "packages/$filename" -C "$RUNNER_TEMP"
          bundle="$RUNNER_TEMP/3x-ui-zh-lite"
          (cd "$bundle"; sha256sum --check --strict --quiet SHA256SUMS)
          test "$(cat "$bundle/SOURCE_COMMIT")" = "$source_rev"
          install -m 0755 install.sh install-online.sh update.sh x-ui.sh "$bundle"
          install -m 0644 scripts/zh-*.sh scripts/x-ui-zh-update.{service,path} "$bundle/scripts/"
          install -m 0644 README.md x-ui.service "$bundle/"
          printf '%s\n' "$GITHUB_SHA" > "$bundle/SOURCE_COMMIT"
          (cd "$bundle"; find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          mkdir "$RUNNER_TEMP/candidate"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -C "$RUNNER_TEMP" -cf - 3x-ui-zh-lite | gzip -n > "$RUNNER_TEMP/candidate/$filename"
          (cd "$RUNNER_TEMP/candidate"; sha256sum "$filename" > "$filename.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: tested-linux-amd64
          path: ${{ runner.temp }}/candidate/
          compression-level: 0
          retention-days: 3
  verify:
    name: ${{ matrix.mode }} / ${{ matrix.old }}
    runs-on: ubuntu-24.04
    needs: package
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        mode: [migrate, rollback]
        old: ['3.11.0', '2.9.2']
        include:
          - mode: fresh
            old: '3.11.0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: tested-linux-amd64
          path: ${{ runner.temp }}/candidate/
      - name: 核对候选包并取得原版测试程序
        env:
          OLD_VERSION: ${{ matrix.old }}
        run: |
          cd "$RUNNER_TEMP/candidate"
          sha256sum --check --strict 3x-ui-v3.11.0-zh.4-linux-amd64.tar.gz.sha256
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 15 --max-time 300 \
            --output "$RUNNER_TEMP/official.tar.gz" \
            "https://github.com/MHSanaei/3x-ui/releases/download/v$OLD_VERSION/x-ui-linux-amd64.tar.gz"
      - name: 在一次性主机上运行真实服务并核对数据
        env:
          OLD_VERSION: ${{ matrix.old }}
          TEST_MODE: ${{ matrix.mode }}
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS,ImageOS,RUNNER_TEMP,GITHUB_RUN_ID \
            env XUI_CI_SYSTEMD_TEST=DISPOSABLE_GITHUB_RUNNER \
            bash scripts/test-zh-systemd.sh "$TEST_MODE" "$RUNNER_TEMP/candidate/3x-ui-v3.11.0-zh.4-linux-amd64.tar.gz" \
              "$RUNNER_TEMP/official.tar.gz" "$OLD_VERSION"
