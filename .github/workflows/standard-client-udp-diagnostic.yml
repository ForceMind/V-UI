name: Stock client finite UDP diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  product-negative-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements-test.txt
      - run: |
          python scripts/fetch_test_cores.py /tmp/vui-product-cores
          python scripts/fetch_mihomo.py /tmp/vui-product-client
      - name: Exact product HTTP API exports and relay UDP rejection
        env:
          VUI_TEST_CORES: /tmp/vui-product-cores
          VUI_TEST_MIHOMO: /tmp/vui-product-client/mihomo
          VUI_INBOUND_ROUTING_LOOPBACK: '1'
        run: |
          set -euo pipefail
          export VUI_DATA_DIR="$(mktemp -d)"
          python - <<'PY' 2>&1 | tee /tmp/vui-product-control.log
          import unittest
          suite=unittest.TestLoader().discover('tests',pattern='test_inbound_routing_real.py')
          assert suite.countTestCases()==10
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful() and not result.skipped
          PY
      - name: Preserve only fixed product control log and official provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: standard-udp-product-negative-control
          path: |
            /tmp/vui-product-control.log
            /tmp/vui-product-cores/provenance.json
            /tmp/vui-product-client/mihomo-provenance.json
          retention-days: 7
          if-no-files-found: error
  finite-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: product
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: product
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: afbdba100c5f0e3dc6888684fdbab31980720df3
          path: legacy
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SagerNet/sing-box
          ref: af6e64c3b69e6132ebaee0e1a3d24e93903f6709
          path: sing-box
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SagerNet/sing-vmess
          ref: 31ec11e8790c48a4bf11711806a61e929ee6b89d
          path: sing-vmess
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SagerNet/sing
          ref: 87c33f17688fe3dd80eeabef7c3f7a69152ccd42
          path: sing
          persist-credentials: false
      - name: Existing fixed Go compiler only
        run: |
          set -euo pipefail
          GO_BIN="$RUNNER_TOOL_CACHE/go/1.25.14/x64/bin"
          test "$(GOTOOLCHAIN=local "$GO_BIN/go" version)" = 'go version go1.25.14 linux/amd64'
          printf '%s\n' "$GO_BIN" >> "$GITHUB_PATH"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '12144080561'
          run-id: '39146603341'
          github-token: ${{ github.token }}
          path: /tmp/vui-stock-mechanism
          merge-multiple: true
      - run: pip install -r requirements-test.txt
      - name: Current adapter controls and unchanged frozen build controls
        env:
          VUI_STOCK_UDP_LEGACY: ${{ github.workspace }}/legacy
        run: |
          python - <<'PYTEST'
          import unittest
          suite=unittest.TestLoader().discover('experiments/standard_client_udp',pattern='test_*.py')
          assert suite.countTestCases()==39
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful() and not result.skipped
          PYTEST
          cd ../legacy
          python - <<'PY'
          import unittest
          suite=unittest.TestLoader().discover('experiments/socks_idle_recovery',pattern='test_*.py')
          assert suite.countTestCases()==159
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful() and not result.skipped
          PY
      - name: Rebuild exact eight-patch candidate with complete old verification
        run: |
          cd ../legacy
          python experiments/socks_idle_recovery/build_and_test.py --sing-box ../sing-box \
            --sing-vmess ../sing-vmess --sing ../sing --mechanism /tmp/vui-stock-mechanism \
            --output /tmp/vui-standard-owner-build
      - run: |
          python scripts/fetch_test_cores.py /tmp/vui-candidate-cores
          python scripts/fetch_mihomo.py /tmp/vui-candidate-client
      - name: Finite stock diagnostic
        id: stock
        continue-on-error: true
        run: |
          python experiments/standard_client_udp/diagnostic_matrix.py --legacy-repository ../legacy --official /tmp/vui-candidate-cores/sing-box --mihomo /tmp/vui-candidate-client/mihomo --arm stock --output /tmp/vui-diag-stock
      - name: Independently validate stock diagnostic text
        id: stock_evidence
        if: ${{ !cancelled() && steps.stock.outcome != 'skipped' }}
        run: |
          python experiments/standard_client_udp/diagnostic_evidence.py --legacy-repository ../legacy --runtime /tmp/vui-diag-stock --arm stock --output /tmp/vui-diag-stock-upload
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() && steps.stock_evidence.outcome == 'success' }}
        with:
          name: standard-udp-diagnostic-stock-text
          path: /tmp/vui-diag-stock-upload
          retention-days: 7
          if-no-files-found: error
      - name: Finite candidate diagnostic
        id: candidate
        continue-on-error: true
        run: |
          python experiments/standard_client_udp/diagnostic_evidence.py --legacy-repository ../legacy --runtime /tmp/vui-diag-stock --arm stock --require-safe
          python experiments/standard_client_udp/diagnostic_matrix.py --legacy-repository ../legacy --official /tmp/vui-candidate-cores/sing-box --mihomo /tmp/vui-candidate-client/mihomo --candidate /tmp/vui-standard-owner-build/owner-sing-box --candidate-provenance /tmp/vui-standard-owner-build/provenance.json --build-evidence /tmp/vui-standard-owner-build/evidence --arm candidate --output /tmp/vui-diag-candidate
      - name: Independently validate candidate diagnostic text
        id: candidate_evidence
        if: ${{ !cancelled() && steps.candidate.outcome != 'skipped' }}
        run: |
          python experiments/standard_client_udp/diagnostic_evidence.py --legacy-repository ../legacy --runtime /tmp/vui-diag-candidate --arm candidate --output /tmp/vui-diag-candidate-upload --build-evidence /tmp/vui-standard-owner-build/evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() && steps.candidate_evidence.outcome == 'success' }}
        with:
          name: standard-udp-diagnostic-candidate-text
          path: /tmp/vui-diag-candidate-upload
          retention-days: 7
          if-no-files-found: error
      - name: Finite overseas-stock diagnostic
        id: overseas
        continue-on-error: true
        run: |
          python experiments/standard_client_udp/diagnostic_evidence.py --legacy-repository ../legacy --runtime /tmp/vui-diag-candidate --arm candidate --require-safe
          python experiments/standard_client_udp/diagnostic_matrix.py --legacy-repository ../legacy --official /tmp/vui-candidate-cores/sing-box --mihomo /tmp/vui-candidate-client/mihomo --candidate /tmp/vui-standard-owner-build/owner-sing-box --candidate-provenance /tmp/vui-standard-owner-build/provenance.json --build-evidence /tmp/vui-standard-owner-build/evidence --arm overseas-stock --output /tmp/vui-diag-overseas-stock
      - name: Independently validate overseas-stock diagnostic text
        id: overseas_evidence
        if: ${{ !cancelled() && steps.overseas.outcome != 'skipped' }}
        run: |
          python experiments/standard_client_udp/diagnostic_evidence.py --legacy-repository ../legacy --runtime /tmp/vui-diag-overseas-stock --arm overseas-stock --output /tmp/vui-diag-overseas-stock-upload --build-evidence /tmp/vui-standard-owner-build/evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() && steps.overseas_evidence.outcome == 'success' }}
        with:
          name: standard-udp-diagnostic-overseas-stock-text
          path: /tmp/vui-diag-overseas-stock-upload
          retention-days: 7
          if-no-files-found: error
      - name: Retain every capacity or release failure
        if: always()
        run: test '${{ steps.stock.outcome }}' = success && test '${{ steps.candidate.outcome }}' = success && test '${{ steps.overseas.outcome }}' = success
