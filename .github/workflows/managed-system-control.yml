name: Explicit managed system control qualification
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
concurrency:
  group: managed-system-control-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  qualify:
    if: >-
      github.event.action == 'labeled' &&
      github.event.label.name == 'run-managed-system-control' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.repository == 'ForceMind/V-UI'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact checkout and install test dependencies
        env:
          SOURCE: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          test -z "$(git status --porcelain)"
          pip install -r requirements-test.txt
      - name: Admit original kit from exact-head successful ordinary CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B -m scripts.fetch_managed_ops_kit --destination /tmp/vui-managed-admission
      - name: Explicit new-component install and real systemd qualification
        env:
          SOURCE: ${{ github.event.pull_request.head.sha }}
          VUI_MANAGED_SYSTEM_ACCEPTANCE: ROOT-SYSTEMD:${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          SHA="$(cat /tmp/vui-managed-admission/manifest.sha256)"
          python -B -m scripts.managed_system_acceptance \
            --kit /tmp/vui-managed-admission/kit --sha256 "$SHA" \
            --source-commit "$SOURCE" --evidence-dir /tmp/vui-managed-evidence
      - name: Preserve only allowlisted qualification records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vui-managed-system-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: |
            /tmp/vui-managed-admission/admission.json
            /tmp/vui-managed-evidence/managed-system.json
          if-no-files-found: warn
          retention-days: 14
