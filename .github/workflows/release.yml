name: Selected release deployment gates
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  deployment:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install development test dependencies only
        run: pip install -r requirements-test.txt
      - name: Build version-pinned offline candidate from exact head
        env:
          VUI_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/vui-release
          test "$(git rev-parse HEAD)" = "$VUI_SOURCE_COMMIT"
          python scripts/build_bundle.py /tmp/vui-release/vui-linux-amd64-rc2.zip --source-commit "$VUI_SOURCE_COMMIT" | tee /tmp/vui-release/build.log
      - name: Install explicit test browser
        run: python -m playwright install --with-deps chromium
      - name: Verify non-root install HTTPS browser and recovery
        env:
          VUI_RELEASE_BUNDLE: /tmp/vui-release/vui-linux-amd64-rc2.zip
          VUI_RELEASE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          export VUI_DATA_DIR="$(mktemp -d)"
          python -B -m unittest discover -s tests -p test_release_deployment.py -v 2>&1 | tee /tmp/vui-release/deployment.log
      - name: Preserve accepted candidate (not an official Release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vui-linux-amd64-rc2-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/vui-release/vui-linux-amd64-rc2.zip
            /tmp/vui-release/vui-linux-amd64-rc2.zip.sha256
          retention-days: 7
      - name: Preserve build and acceptance results only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vui-rc2-build-and-test-evidence
          path: /tmp/vui-release/*.log
          retention-days: 7
